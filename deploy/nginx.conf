# Include in nginx's http context. Replace domain and TLS certificate paths.
limit_req_zone $binary_remote_addr zone=arena_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=arena_api:10m rate=10r/s;

server {
    listen 80;
    server_name arena.example.org;
    return 301 https://arena.example.org$request_uri;
}
server {
    listen 443 ssl;
    server_name arena.example.org;
    ssl_certificate /etc/letsencrypt/live/arena.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena.example.org/privkey.pem;
    client_max_body_size 180k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /api/login {
        limit_req zone=arena_login burst=15 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host arena.example.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
    location / {
        limit_req zone=arena_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host arena.example.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
